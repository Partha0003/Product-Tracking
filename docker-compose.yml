version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: product-tracking-db
    restart: always
    environment:
      POSTGRES_DB: product_tracking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
